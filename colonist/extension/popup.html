<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body  { font-family: sans-serif; width: 240px; padding: 12px; }
    h3    { margin: 0 0 8px; }
    p     { margin: 4px 0; font-size: 13px; color: #555; }
    code  { background: #f0f0f0; padding: 1px 4px; border-radius: 3px; font-size: 12px; }
    hr    { margin: 10px 0; border: none; border-top: 1px solid #ddd; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 10px 0 4px;
    }
    .toggle-label { font-size: 14px; font-weight: bold; }

    /* Toggle switch */
    .switch { position: relative; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background: #ccc; border-radius: 24px; transition: .2s;
    }
    .slider:before {
      position: absolute; content: "";
      height: 18px; width: 18px;
      left: 3px; bottom: 3px;
      background: white; border-radius: 50%; transition: .2s;
    }
    input:checked + .slider { background: #4caf50; }
    input:checked + .slider:before { transform: translateX(20px); }

    #status {
      font-size: 12px; color: #888; margin-top: 4px;
    }
    #status.active { color: #4caf50; font-weight: bold; }
  </style>
</head>
<body>
  <h3>Catanbot</h3>
  <p>Extension active on <strong>colonist.io</strong>.</p>
  <p>Start the Python server first:</p>
  <p><code>python -m colonist.server</code></p>
  <hr>

  <div class="toggle-row">
    <span class="toggle-label">Auto-play</span>
    <label class="switch">
      <input type="checkbox" id="autoPlayToggle">
      <span class="slider"></span>
    </label>
  </div>
  <p id="status">Advisory mode — recommendations logged to console only.</p>

  <hr>
  <p style="font-size:11px;color:#aaa;">
    Verify outbound WS field names: DevTools → Network → WS → outbound frames.
  </p>

  <script>
    const toggle = document.getElementById('autoPlayToggle');
    const status = document.getElementById('status');

    function updateStatus(on) {
      if (on) {
        status.textContent = 'Auto-play ON — bot sends actions automatically.';
        status.className = 'active';
      } else {
        status.textContent = 'Advisory mode — recommendations logged to console only.';
        status.className = '';
      }
    }

    // Load persisted state.
    chrome.storage.local.get('autoPlay', (data) => {
      toggle.checked = !!data.autoPlay;
      updateStatus(toggle.checked);
    });

    // On toggle change, persist and notify the content script.
    toggle.addEventListener('change', () => {
      const on = toggle.checked;
      chrome.storage.local.set({ autoPlay: on });
      updateStatus(on);

      // Relay to the content script running on the active colonist.io tab.
      chrome.tabs.query({ active: true, currentWindow: true }, (tabs) => {
        if (tabs[0]?.id) {
          chrome.tabs.sendMessage(tabs[0].id, { type: 'setAutoPlay', value: on });
        }
      });
    });
  </script>
</body>
</html>
